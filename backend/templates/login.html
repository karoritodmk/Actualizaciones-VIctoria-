<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Victoria - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', path='css/styles.css') }}">
</head>
<body class="login-body">

    <main class="login-container">
        <section class="left-panel">
            <div class="glass-card login-card">
                <div class="login-header">
                    <span class="brand-text">VICTORIA</span>
                    <img src="{{ url_for('static', path='img/v_logo_original.png') }}" alt="V" class="v-mini-logo">
                </div>

                <h2 class="login-title">Log in</h2>

                <form id="login-form" novalidate>
                    <div class="custom-input-group">
                        <span class="input-icon-wrapper"><i class="bi bi-person"></i></span>
                        <input type="text" id="username" name="username" placeholder="numero de documento"
                               required oninvalid="this.setCustomValidity('Por favor, rellena este campo')"
                               oninput="this.setCustomValidity('')" autocomplete="off">
                    </div>

                    <div class="custom-input-group">
                        <span class="input-icon-wrapper"><i class="bi bi-lock"></i></span>
                        <input type="password" id="password" name="password" placeholder="contraseña"
                               required oninvalid="this.setCustomValidity('Por favor, rellena este campo')"
                               oninput="this.setCustomValidity('')">
                    </div>

                    <p id="login-error" class="login-error-text" style="display:none; color:#ff6b6b; font-size:0.85rem; margin:-10px 0 12px;"></p>

                    <p class="login-info-text">
                        Aca podras ver los repositorios y materiales SENA, incluyendo portafolios instructor aprendiz.
                    </p>

                    <div class="login-footer-actions">
                        <a href="#" class="btn-forgot-password">Olvidaste tu contraseña?</a>
                        <button type="submit" id="login-submit" class="btn-submit-arrow"><i class="bi bi-arrow-right"></i></button>
                    </div>
                </form>
            </div>

            <div class="support-bar">
                <div class="support-meta">
                    <h3>Necesitas ayuda?</h3>
                    <p>da click aquí!!</p>
                </div>
                <a href="#" class="support-action-btn">
                    <span>click</span>
                    <span class="arrow-circle"><i class="bi bi-arrow-right"></i></span>
                </a>
            </div>
        </section>

        <section class="right-panel">
            <img src="{{ url_for('static', path='img/Frame 2.png') }}" alt="Figma" class="figma-static-img">
        </section>
    </main>

    <script src="{{ url_for('static', path='js/auth.js') }}"></script>
</body>
</html>
