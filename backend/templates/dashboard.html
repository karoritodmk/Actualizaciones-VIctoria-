<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Victoria - Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', path='css/styles.css') }}">
</head>
<body class="dashboard-body">

    <div id="dashboard-root" class="container">
        <div class="glass-card p-4" style="max-width: 640px; margin: 0 auto;">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="d-flex align-items-center gap-2">
                    <img src="{{ url_for('static', path='img/v_logo_original.png') }}" alt="V" style="height:36px;">
                    <span class="brand-text">VICTORIA</span>
                </div>
                <button id="logout-btn" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-box-arrow-right"></i> Cerrar sesión
                </button>
            </div>

            <h2 class="mb-1" id="dashboard-nombre">Cargando…</h2>
            <p class="text-white-50 mb-4" id="dashboard-rol"></p>

            <ul class="list-unstyled" style="line-height: 2.2;">
                <li><i class="bi bi-person-vcard me-2"></i>Documento: <span id="dashboard-documento"></span></li>
                <li><i class="bi bi-mortarboard me-2"></i>Correo SENA: <span id="dashboard-correo-sena"></span></li>
                <li><i class="bi bi-envelope me-2"></i>Correo personal: <span id="dashboard-correo-personal"></span></li>
                <li><i class="bi bi-activity me-2"></i>Estado: <span id="dashboard-estado"></span></li>
            </ul>

            <p class="text-white-50 mt-4 mb-0" style="font-size: 0.85rem;">
                Estos datos se consultan en vivo desde la base de datos a través de
                <code>GET /api/v1/auth/me</code>.
            </p>
        </div>
    </div>

    <script src="{{ url_for('static', path='js/auth.js') }}"></script>
</body>
</html>
